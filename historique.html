<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E•C•S — Historique des Duels</title>
    <link rel="stylesheet" href="dist/output.css" />
  </head>
  <body class="bg-slate-900/80 text-slate-100 min-h-screen font-sans flex flex-col justify-between">
    <header class="sticky top-0 z-50 bg-sky-950 backdrop-blur border-b border-slate-800">
      <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
        <div class="flex items-center gap-3">
          <a
            href="index.html"
            class="flex items-center gap-3 group transition-transform active:scale-95"
            aria-label="Accueil E-C-S"
          >
            <div
              class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-xl shadow-md group-hover:border-amber-500/50 transition-colors"
            >
              <span class="relative">👑<span class="absolute -bottom-1 -right-1 text-[10px]">⛓️</span></span>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-1.5 font-black text-sm tracking-widest text-amber-400">
                <span>E</span><span class="text-slate-600">•</span><span>C</span><span class="text-slate-600">•</span
                ><span class="text-rose-500">S</span>
              </div>
              <span class="text-[9px] font-bold tracking-wider text-white uppercase">Empereur • Citoyen • Esclave</span>
            </div>
          </a>
        </div>
        <nav aria-label="Navigation principale">
          <ul
            class="flex items-center gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs font-semibold"
          >
            <li>
              <a
                href="index.html"
                class="px-3.5 py-1.5 rounded-lg text-slate-300 hover:text-white hover:border-2 hover:border-amber-500 block transition"
                >Profils</a
              >
            </li>
            <li>
              <a
                href="jeu.html"
                class="px-3.5 py-1.5 rounded-lg text-slate-300 hover:text-white hover:border-2 hover:border-amber-500 block transition"
                >Duel (Jeu)</a
              >
            </li>
            <li>
              <a
                href="historique.html"
                class="px-3.5 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold block transition"
                aria-current="page"
                >Historique</a
              >
            </li>
          </ul>
        </nav>
        <div id="active-player-slot"></div>
      </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full">
      <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h2 class="text-2xl font-black text-white flex items-center gap-2"><span>📜</span> Historique des parties</h2>
        </div>
        <button
          type="button"
          id="btn-clear-history"
          class="self-start sm:self-auto px-4 py-2 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white text-xs font-bold transition flex items-center gap-2 cursor-pointer"
        >
          🗑️ Vider l'historique
        </button>
      </div>
      <div class="mb-6 p-4 rounded-2xl border border-slate-800 bg-slate-900/60 grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label for="search-input" class="block text-xs font-semibold text-slate-400 mb-1.5">
            Rechercher par pseudo
          </label>
          <input
            type="text"
            id="search-input"
            placeholder="Pseudo..."
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
          />
        </div>
        <div>
          <label for="filter-result" class="block text-xs font-semibold text-slate-400 mb-1.5"> Résultat </label>
          <select
            id="filter-result"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500 transition cursor-pointer"
          >
            <option value="ALL">Tous</option>
            <option value="VICTOIRE">Victoires</option>
            <option value="DEFAITE">Défaites</option>
            <option value="ABANDON">Abandons</option>
            <option value="EGALITE">Égalités</option>
          </select>
        </div>
        <div>
          <label for="filter-period" class="block text-xs font-semibold text-slate-400 mb-1.5"> Période </label>
          <select
            id="filter-period"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500 transition cursor-pointer"
          >
            <option value="ALL">Tout</option>
            <option value="TODAY">Aujourd'hui</option>
            <option value="7DAYS">7 derniers jours</option>
          </select>
        </div>
      </div>
      <section id="history-container" class="space-y-3"></section>
    </main>
    <footer class="p-4 border-t border-slate-800 text-center text-xs text-white bg-sky-950/80 uppercase">
      Club E•C•S — 2026
    </footer>
    <script type="module" src="src/main.js" defer></script>
  </body>
</html>
