<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E•C•S — Profils des Joueurs</title>
    <link rel="stylesheet" href="dist/output.css" />
  </head>
  <body class="bg-slate-900/80 text-slate-100 min-h-screen font-sans flex flex-col justify-between">
    <header class="sticky top-0 z-50 bg-sky-950 backdrop-blur border-b border-slate-800">
      <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
        <div class="flex items-center gap-3">
          <a
            href="index.html"
            class="flex items-center gap-3 group transition-transform active:scale-95"
            aria-label="Accueil E-C-S"
          >
            <div
              class="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-xl shadow-md group-hover:border-amber-500/50 transition-colors"
            >
              <span class="relative">
                👑
                <span class="absolute -bottom-1 -right-1 text-[10px]">⛓️</span>
              </span>
            </div>
            <div class="flex flex-col">
              <div class="flex items-center gap-1.5 font-black text-sm tracking-widest text-amber-400">
                <span>E</span>
                <span class="text-slate-600">•</span>
                <span>C</span>
                <span class="text-slate-600">•</span>
                <span class="text-rose-500">S</span>
              </div>
              <span class="text-[9px] font-bold tracking-wider text-white uppercase">
                Empereur • Citoyen • Esclave
              </span>
            </div>
          </a>
        </div>
        <nav aria-label="Navigation principale">
          <ul class="flex items-center gap-2 bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs font-semibold">
            <li>
              <a
                href="index.html"
                class="px-3.5 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold block transition"
              >
                Profils
              </a>
            </li>
            <li>
              <a
                href="jeu.html"
                class="px-3.5 py-1.5 rounded-lg text-slate-300 hover:text-white hover:border-2 hover:border-amber-500 block transition"
              >
                Duel (Jeu)
              </a>
            </li>
            <li>
              <a
                href="historique.html"
                class="px-3.5 py-1.5 rounded-lg text-slate-300 hover:text-white block hover:border-2 hover:border-amber-500 transition"
              >
                Historique
              </a>
            </li>
          </ul>
        </nav>
        <div id="active-player-slot"></div>
      </div>
    </header>
    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full">
      <div class="mb-6">
        <h2 class="text-2xl font-black text-white">Gestion des Profils</h2>
        <p class="text-xs sm:text-sm text-white">
          Créez votre profil et choisissez le joueur actif avant de lancer un duel.
        </p>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <section class="lg:col-span-5 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
          <h3 id="form-heading" class="text-base font-bold text-white mb-4">Créer un Profil</h3>
          <form id="player-form" class="space-y-4" novalidate>
            <input type="hidden" id="form-player-id" />
            <div>
              <label for="nickname-input" class="block text-xs font-semibold text-slate-300 mb-2">
                Pseudo <span class="text-slate-500 font-normal">(3 à 15 car, lettres, chiffres, _)</span>
              </label>
              <input
                type="text"
                id="nickname-input"
                placeholder="ex. Yanis_07"
                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-4 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-2 focus:border-amber-500 hover:border-amber-100 transition"
                required
              />
              <p id="nickname-error" class="text-xs text-rose-500 mt-1 min-h-4"></p>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-2">Avatar</label>
              <div class="grid grid-cols-6 gap-2">
                <label class="cursor-pointer">
                  <input type="radio" name="avatar" value="👑" checked class="peer sr-only" />
                  <div
                    class="w-full aspect-square flex items-center justify-center rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-amber-500 peer-hover:border-amber-400 peer-checked:bg-amber-500/10 peer-checked:ring-1 peer-checked:ring-amber-500 text-xl transition"
                  >
                    👑
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="avatar" value="🛡️" class="peer sr-only" />
                  <div
                    class="w-full aspect-square flex items-center justify-center rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-amber-500 peer-hover:border-amber-400 peer-checked:bg-amber-500/10 peer-checked:ring-1 peer-checked:ring-amber-500 text-xl transition"
                  >
                    🛡️
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="avatar" value="⛓️" class="peer sr-only" />
                  <div
                    class="w-full aspect-square flex items-center justify-center rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-amber-500 peer-hover:border-amber-400 peer-checked:bg-amber-500/10 peer-checked:ring-1 peer-checked:ring-amber-500 text-xl transition"
                  >
                    ⛓️
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="avatar" value="🦅" class="peer sr-only" />
                  <div
                    class="w-full aspect-square flex items-center justify-center rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-amber-500 peer-hover:border-amber-400 peer-checked:bg-amber-500/10 peer-checked:ring-1 peer-checked:ring-amber-500 text-xl transition"
                  >
                    🦅
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="avatar" value="🐺" class="peer sr-only" />
                  <div
                    class="w-full aspect-square flex items-center justify-center rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-amber-500 peer-hover:border-amber-400 peer-checked:bg-amber-500/10 peer-checked:ring-1 peer-checked:ring-amber-500 text-xl transition"
                  >
                    🐺
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input type="radio" name="avatar" value="🎭" class="peer sr-only" />
                  <div
                    class="w-full aspect-square flex items-center justify-center rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-amber-500 peer-hover:border-amber-400 peer-checked:bg-amber-500/10 peer-checked:ring-1 peer-checked:ring-amber-500 text-xl transition"
                  >
                    🎭
                  </div>
                </label>
              </div>
            </div>
            <div class="flex items-center gap-2 pt-2">
              <button
                type="submit"
                id="submit-btn"
                class="flex-1 bg-amber-500 hover:bg-amber-700 hover:text-amber-50 hover:border text-slate-950 font-bold py-2.5 px-4 rounded-xl text-xs sm:text-sm transition"
              >
                Créer le profil
              </button>
              <button
                type="button"
                id="cancel-btn"
                class="hidden px-4 py-2.5 rounded-xl border border-slate-700 text-xs text-slate-300 hover:text-white hover:bg-slate-800 transition"
              >
                Annuler
              </button>
            </div>
          </form>
        </section>
        <section class="lg:col-span-7 bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
          <h3 class="text-base font-bold text-white mb-4">Membres du Club</h3>
          <div id="players-list-container" class="space-y-3"></div>
        </section>
      </div>
    </main>
    <footer class="p-4 border-t border-slate-800 text-center text-xs text-white bg-sky-950/80 uppercase">
      Club E•C•S — 2026
    </footer>
    <script type="module" src="src/main.js" defer></script>
  </body>
</html>
